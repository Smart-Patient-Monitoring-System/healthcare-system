server:
  port: 8084

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # ── MainService (:8080) ──────────────────────────
            - id: main-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/main/**

            - id: main-auth
              uri: http://localhost:8080
              predicates:
                - Path=/api/auth/**

            - id: main-doctor
              uri: http://localhost:8080
              predicates:
                - Path=/api/doctor/**

            - id: main-patient
              uri: http://localhost:8080
              predicates:
                - Path=/api/patient/**

            - id: main-patients
              uri: http://localhost:8080
              predicates:
                - Path=/api/patients/**

            - id: main-vital-signs
              uri: http://localhost:8080
              predicates:
                - Path=/api/vital-signs/**

            - id: main-emergency
              uri: http://localhost:8080
              predicates:
                - Path=/api/emergency/**

            - id: main-doctors
              uri: http://localhost:8080
              predicates:
                - Path=/api/doctors/**

            - id: main-appointments
              uri: http://localhost:8080
              predicates:
                - Path=/api/appointments/**,/api/appointment-types/**

            - id: main-admin
              uri: http://localhost:8080
              predicates:
                - Path=/api/admin/**

            - id: main-payments
              uri: http://localhost:8080
              predicates:
                - Path=/api/payments/**

            - id: main-availability
              uri: http://localhost:8080
              predicates:
                - Path=/api/availability/**

            - id: main-pendingdoctor
              uri: http://localhost:8080
              predicates:
                - Path=/api/pendingdoctor/**

            - id: main-health-data
              uri: http://localhost:8080
              predicates:
                - Path=/api/health-data/**

            - id: main-reports
              uri: http://localhost:8080
              predicates:
                - Path=/api/reports/**

            # ── VitalReports-AI (:8081) ──────────────────────
            - id: vital-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/vital/**

            # ── IoT Service (:8082) ──────────────────────────
            - id: iot-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/iot/**

            # ── Chatbot Service (:8083) ──────────────────────
            - id: chatbot-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/chat/**